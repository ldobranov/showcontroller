{% extends "base.html" %}
{% block content %}
  <div class="panel">
    <div class="card-header">
      <div>
        <h2>Event Log</h2>
        <p class="muted">Recent controller and runtime activity.</p>
      </div>
      <form method="post" action="/logs/clear">
        <button type="submit">Clear log</button>
      </form>
    </div>
    <pre>{% for l in logs %}{{ l }}
{% endfor %}</pre>
  </div>
{% endblock %}
